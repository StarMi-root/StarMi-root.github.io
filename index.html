<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蛙蛙新闻网 · FROG DAILY</title>
    <meta name="description" content="呱得准，更要呱得真。蛙蛙新闻网——全塘最具影响力的两栖类媒体。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* 主题底色立即生效，避免白闪 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      body {
        background-color: #0b1f15;
        color: #e9f2e4;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1f15;
        font-family: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
        color: #8fd65a;
        letter-spacing: 0.3em;
      }
      #boot-loader .boot-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #f5c842;
        animation: boot-hop 0.8s ease-in-out infinite;
      }
      @keyframes boot-hop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .boot-dot { animation: none; }
      }
    </style>
    <script>
      // 主题类名兼容脚本（仅设置类名与 data-theme，不覆盖站点自身配色）
      (function () {
        var isInIframe = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              var theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>

:"体育记者",time:"今日 09:30",readCount:22400,lede:"蝌蚪奥运会自由泳预赛今日在清水湾泳馆落幕，共有四项赛会纪录被刷新。赛后采访中，破纪录选手蚪蚪强表示：「尾巴摆得快，全靠小时候营养好。」",body:["最引人注目的是 100 厘米自由泳决赛资格的争夺，三号赛道选手蚪蚪强以 3.2 秒的成绩刷新纪录，其尾部摆动频率达到每秒 14 次，被现场解说称为「装了马达的尾巴」。","本届蝌蚪奥运首次引入高速水波摄像系统，每场比赛生成「摆尾轨迹图」，供教练团队复盘。专家提醒，蝌蚪选手正处于「长腿关键期」，训练量需科学控制，避免影响变态发育进程。","组委会同时宣布，鉴于近期蛙口出生率上升，下一届蝌蚪奥运将新增「集体转圈」表演项目，预计参赛规模将翻倍。"],cover:nt.tadpole,images:[nt.tadpole]},{id:"a5",title:"两栖科学院发布「荷叶三号」无人机，续航提升三倍",category:"科技",author:"蛙博士",role:"科技记者",time:"昨日 14:20",readCount:18900,lede:"两栖科学院今日发布新一代荷叶无人机「荷叶三号」，采用仿生叶脉供电结构，续航时间提升至旧款的三倍，可连续巡航整个荷塘。",body:["「荷叶三号」最大亮点是叶脉式太阳能收集网络，能在阴天保持 60% 的充电效率。机身材料来自可再生荷叶纤维，坠塘后可完全降解，不会造成水体污染——这一点获得了环保组织「清水会」的高度评价。","科学院首席工程师蛙爱迪介绍，新机还搭载了「虫群雷达」，可实时绘制蚊虫密度热力图，数据将免费开放给全塘蛙民，「科技的意义，是让每一只蛙都能吃饱」。","首批「荷叶三号」将于下周交付荷塘日报社与快递站使用。有蛙民建议推出载人版本，蛙爱迪回应：「先解决续航，再谈载蛙，科学来不得半点跳跃。」"],cover:nt.drone,images:[nt.drone]},{id:"a6",title:"暴雨橙色预警：编辑部全员转入水下办公，报纸照常发行",category:"社会",author:"蛙呱呱",role:"气象主播",time:"今日 07:55",readCount:15200,lede:"气象台今晨发布暴雨橙色预警，预计今夜至明晨有大到暴雨。蛙蛙新闻网已启动应急预案，全员转入水下办公模式，今日报纸照常发行。",body:["记者了解到，编辑部水下办公区位于荷塘东侧三米深处，配备防水荷叶键盘与气泡通讯系统。值班编辑蛙小跳表示，水下办公的最大优势是「绝对安静」，缺点则是「墨汁容易被冲散」。","为保障投递，邮递员队伍已扩编至四十只，全部换装防水睡莲邮包。气象主播蛙呱呱提醒广大蛙民：暴雨期间请收紧荷叶屋顶，外出携带浮萍雨具，谨防被水流冲入邻塘。","另据水文站数据，当前荷塘水位 1.82 米，距警戒水位还有 0.6 米余量，防汛物资（沙袋、水草、备用荷叶）储备充足。"],patternChar:"雨"},{id:"a7",title:"创刊特辑：一张荷叶，如何撑起一份报纸",category:"文化",author:"蛙长老",role:"总编辑",time:"昨日 08:00",readCount:41700,lede:"2026 年 9 月 4 日清晨 7:20，蛙蛙新闻网在一片巴掌大的荷叶上创刊，头版只印了 3 份。短短一天，这片荷叶已经长成一张覆盖三百多个荷塘的新闻网络。",body:["走进编辑部的荣誉室，那片创刊荷叶被保存在露珠恒温箱中，叶脉间依稀可辨当时手写的头条：「雨停了，太阳出来了，虫子多了」。总编辑蛙长老说，这句话奠定了报社的基调——永远报道蛙民最关心的事。","创刊以来，报社经历了一次搬迁、一场骤雨，记者队伍从 7 只发展到 128 只。唯一不变的，是每天清晨六点准时响起的开编会蛙鸣，和那句挂在墙上的社训：「呱得准，更要呱得真。」","值此官网正式上线之际，本社同步开放图片、视频全媒体投稿。蛙长老在寄语中写道：「下一片荷叶，希望就是一个头条。」"],cover:nt.newsroom,images:[nt.newsroom,nt.council]},{id:"a8",title:"家的悄悄话",category:"文化",author:"蛙蛙社全社成员",role:"全",time:"2026-09-06 15:00",readCount:20120602,lede:"导语内容",body:["正文第一段","正文第二段","更多段落"],cover:"pic/mmexport1788688097968.jpg",images:["pic/mmexport1788688097968.jpg"],video
